<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moja strona</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f12;
      color: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .box {
      max-width: 600px;
      padding: 30px;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      opacity: 0.8;
      line-height: 1.5;
    }

    .btn {
      margin-top: 20px;
      display: inline-block;
      padding: 10px 20px;
      background: white;
      color: black;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .btn:hover {
      opacity: 0.8;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>Hej, jestem Nikola</h1>
    <p>
      To moja strona internetowa. Tu możesz coś o sobie napisać,
      udawać że masz projekt albo po prostu wyglądać poważnie w internecie.
    </p>

    <a class="btn" href="#">Kontakt</a>
  </div>
</body>
</html>
